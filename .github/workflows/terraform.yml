name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      # Validate the configuration without the GCS backend or credentials, so CI
      # proves the code is well-formed. Real init/import/plan/apply run against
      # the backend where the provider plugin can execute.
      - run: terraform init -backend=false
      - run: terraform validate
